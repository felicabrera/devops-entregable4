apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Prohibir la etiqueta latest
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Las imagenes deben declarar una etiqueta explicita (o un digest) distinta de
      latest para que los despliegues sean reproducibles y auditables. Aplica a
      containers, initContainers y ephemeralContainers.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(request.?namespace.orValue('') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'local-path-storage', 'falco', 'jenkins'])"
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: "variables.allContainers.all(c, c.image.contains('@') || c.image.lastIndexOf(':') > c.image.lastIndexOf('/'))"
      message: "Las imagenes deben tener una etiqueta explicita o un digest (no se permite imagen sin etiqueta)."
    - expression: "variables.allContainers.all(c, !c.image.endsWith(':latest'))"
      message: "No se permite usar la etiqueta latest en las imagenes."
