apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Prohibir contenedores privilegiados y namespaces del host
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Un contenedor privilegiado o con acceso a los namespaces del host puede
      escapar del aislamiento. Se prohibe privileged, allowPrivilegeEscalation,
      hostPID, hostIPC y hostNetwork, y se exige descartar todas las capabilities.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(request.?namespace.orValue('') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'local-path-storage', 'falco', 'jenkins'])"
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
    - name: ephemeral
      expression: "object.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        !object.spec.?hostPID.orValue(false)
        && !object.spec.?hostIPC.orValue(false)
        && !object.spec.?hostNetwork.orValue(false)
      message: "No se permite hostPID, hostIPC ni hostNetwork."
    - expression: >-
        variables.containers.all(c,
          !c.?securityContext.?privileged.orValue(false)
          && c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false
          && 'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
        && variables.ephemeral.all(c,
          !c.?securityContext.?privileged.orValue(false)
          && !c.?securityContext.?allowPrivilegeEscalation.orValue(false))
      message: "Los contenedores no pueden ser privilegiados y deben fijar allowPrivilegeEscalation: false y capabilities.drop: [ALL]."
