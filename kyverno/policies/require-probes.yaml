apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Exigir readiness y liveness probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/description: >-
      Sin probes Kubernetes no puede detectar un contenedor colgado ni evitar
      enviarle trafico antes de que este listo. Se exigen readinessProbe y
      livenessProbe en los contenedores de las cargas de trabajo de larga duracion.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: "!(request.?namespace.orValue('') in ['kube-system', 'kube-public', 'kube-node-lease', 'kyverno', 'local-path-storage', 'falco', 'jenkins'])"
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))
      message: "Todos los contenedores deben definir readinessProbe y livenessProbe."
