# Viola disallow-privileged-containers (privileged, escalado y hostPID)
apiVersion: v1
kind: Pod
metadata:
  name: pod-privilegiado
spec:
  hostPID: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.31.7-alpine
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
