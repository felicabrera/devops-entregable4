# El contenedor principal cumple, pero el initContainer viola las politicas
apiVersion: v1
kind: Pod
metadata:
  name: pod-init-no-conforme
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  initContainers:
    - name: init
      image: busybox:latest
      command: ["true"]
      securityContext:
        runAsUser: 0
  containers:
    - name: app
      image: notes-backend:dev
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 256Mi}
