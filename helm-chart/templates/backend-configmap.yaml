{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes.componentName" (dict "root" . "component" "backend") }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  API_TITLE: {{ .Values.backend.config.apiTitle | quote }}
  WELCOME_MESSAGE: {{ .Values.backend.config.welcomeMessage | quote }}
  HEALTH_PARAM: {{ .Values.backend.config.healthParam | quote }}
  MAX_NOTE_LENGTH: {{ .Values.backend.config.maxNoteLength | quote }}
  APP_ENV: {{ .Values.environment | quote }}
{{- end }}
