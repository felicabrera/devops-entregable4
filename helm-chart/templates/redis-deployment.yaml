{{- if .Values.redis.enabled }}
{{- $name := include "notes.componentName" (dict "root" . "component" "redis") }}
{{- $r := .Values.redis }}
# Almacenamiento compartido de notas: todas las replicas del backend leen y escriben aca
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # Un volumen ReadWriteOnce no puede montarse en dos pods a la vez
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "notes.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notes.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: {{ $r.image.repository }}:{{ $r.image.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - --appendonly
            - "yes"
            - --dir
            - /data
            # El acceso lo restringe la NetworkPolicy: solo el backend llega al puerto 6379
            - --protected-mode
            - "no"
            - --maxmemory
            - {{ $r.maxmemory | quote }}
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if $r.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
