{{- if and .Values.networkPolicy.enabled .Values.backend.enabled }}
# Solo el frontend, Prometheus y los pods del propio release pueden hablar con el backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notes.componentName" (dict "root" . "component" "backend") }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "notes.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
