{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes.componentName" (dict "root" . "component" "backend") }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "notes.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
---
# Servicio headless: Prometheus descubre cada pod del backend por DNS (un target por replica)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes.componentName" (dict "root" . "component" "backend") }}-headless
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "notes.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
{{- end }}
