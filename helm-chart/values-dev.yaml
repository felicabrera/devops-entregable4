# Entorno de desarrollo: Kubernetes de Docker Desktop.
# Las imagenes se construyen localmente (docker build). En modo kubeadm el cluster comparte el
# daemon y se usan tal cual; en modo kind scripts/init.sh las publica en localhost:5001 y
# sobrescribe image.registry y los tags. pullPolicy es IfNotPresent en ambos casos.
environment: dev

image:
  registry: ""
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  image:
    repository: notes-backend
    tag: dev
  config:
    welcomeMessage: Notes API (dev)

redis:
  persistence:
    enabled: true
    size: 1Gi

frontend:
  image:
    repository: notes-frontend
    tag: dev
  service:
    type: LoadBalancer   # Docker Desktop lo expone en localhost:80
    port: 80

monitoring:
  prometheus:
    retention: 2d
    service:
      type: LoadBalancer
      port: 9091
    persistence:
      enabled: true
      size: 1Gi
  grafana:
    service:
      type: LoadBalancer
      port: 3001
    rootUrl: http://localhost:3001

networkPolicy:
  enabled: true
