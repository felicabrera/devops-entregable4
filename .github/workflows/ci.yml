name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pytest-results
          path: backend/pytest.xml

  frontend:
    name: Frontend (nginx config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Construir y validar la configuracion de nginx
        run: |
          docker build -t notes-frontend:ci frontend
          docker run --rm -e BACKEND_HOST=backend -e BACKEND_PORT=8000 notes-frontend:ci \
            sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'

  dockerfiles:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: jenkins/Dockerfile
          ignore: DL3008,DL3013

  scripts:
    name: Scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck -x scripts/*.sh

  helm:
    name: Helm chart (lint, kube-linter, Kyverno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.19.0
      - name: helm lint
        run: |
          helm lint helm-chart
          helm lint helm-chart -f helm-chart/values-dev.yaml
          helm lint helm-chart -f helm-chart/values-prod.yaml --set backend.image.tag=ci,frontend.image.tag=ci
      - name: Dashboard de Grafana sincronizado con el chart
        run: |
          python3 scripts/build-dashboard.py
          git diff --exit-code -- grafana/dashboard.json helm-chart/files/dashboard.json
          cmp grafana/dashboard.json helm-chart/files/dashboard.json
      - name: Renderizar manifiestos
        run: |
          mkdir -p rendered
          helm template notes helm-chart -f helm-chart/values-dev.yaml > rendered/dev.yaml
          helm template notes helm-chart -f helm-chart/values-prod.yaml --set backend.image.tag=ci,frontend.image.tag=ci > rendered/prod.yaml
      - name: kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: rendered
          config: .kube-linter.yaml
      - name: Instalar el CLI de Kyverno
        uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.19.2
      - name: Politicas de Kyverno sobre los manifiestos renderizados
        run: |
          kyverno apply kyverno/policies/ --resource rendered/dev.yaml
          kyverno apply kyverno/policies/ --resource rendered/prod.yaml
      - name: Pruebas unitarias de las politicas (kyverno test)
        run: kyverno test kyverno/test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-manifests
          path: rendered/

  jenkinsfile:
    name: Jenkinsfile (declarative linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Levantar Jenkins con el plugin de pipeline
        run: |
          docker run -d --name jenkins -p 8080:8080 -e JAVA_OPTS=-Djenkins.install.runSetupWizard=false \
            jenkins/jenkins:2.580.2-lts-jdk21
          docker exec jenkins jenkins-plugin-cli --plugins pipeline-model-definition
          docker restart jenkins
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8080/login && break; sleep 5; done
      - name: Validar el Jenkinsfile
        run: |
          CRUMB=$(curl -fsS 'http://localhost:8080/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,":",//crumb)')
          RESULT=$(curl -fsS -X POST -H "$CRUMB" -F "jenkinsfile=<Jenkinsfile" http://localhost:8080/pipeline-model-converter/validate)
          echo "$RESULT"
          echo "$RESULT" | grep -q 'successfully validated'
