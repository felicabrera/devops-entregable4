# Configuracion como codigo de Jenkins (plugin configuration-as-code).
# Las credenciales se leen de variables de entorno que define docker-compose.yml.
jenkins:
  systemMessage: "Jenkins del laboratorio 4 de DevOps: pipeline de la Notes API"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD:-admin}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  remotingSecurity:
    enabled: true

unclassified:
  location:
    url: http://localhost:8081/
    adminAddress: admin@localhost

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: snyk-token
              description: Token de Snyk
              secret: ${SNYK_TOKEN:-}
          - usernamePassword:
              id: ghcr-credentials
              description: Token para publicar en ghcr.io (write:packages)
              username: ${GHCR_USER:-felicabrera}
              password: ${GHCR_TOKEN:-}
          - file:
              id: kubeconfig-dev
              description: Kubeconfig del cluster local (Docker Desktop)
              fileName: kubeconfig
              secretBytes: ${base64:${readFile:/var/jenkins_secrets/kubeconfig-dev}}
          - file:
              id: kubeconfig-prod
              description: Kubeconfig del cluster de la facultad (alumno-team9)
              fileName: kubeconfig
              secretBytes: ${base64:${readFile:/var/jenkins_secrets/kubeconfig-prod}}

jobs:
  - file: /var/jenkins_config/jobs.groovy
